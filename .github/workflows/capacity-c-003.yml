name: capacity-c-003
run-name: ${{ inputs.helio_execution_id }}
'on':
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''
      environment:
        type: string
        default: capacity-c-003-production
permissions:
  contents: read
  deployments: write
concurrency:
  group: capacity-c-003-release
  cancel-in-progress: false
jobs:
  test:
    runs-on:
      - self-hosted
      - helio-tomcat
    timeout-minutes: 10
    environment: capacity-c-003-test
    steps:
      - name: Synthetic runner work
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |-
          if [[ "$RELEASE_VERSION" == *-failjob-* && "$GITHUB_RUN_ATTEMPT" == "1" ]]; then echo "Synthetic failure on the first attempt (NFR test 4)"; exit 1; fi
          sleep 30
  production:
    needs: test
    runs-on:
      - self-hosted
      - helio-tomcat
    timeout-minutes: 10
    environment: capacity-c-003-production
    steps:
      - name: Synthetic runner work
        shell: bash
        run: sleep 30
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: capacity-c-003
          TARGET_ENVIRONMENT: capacity-c-003-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |-
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          assert os.environ["WORKFLOW_REVISION"] == os.environ["GITHUB_SHA"]
          artifact = pathlib.Path("synthetic-artifact.json")
          artifact.write_text(json.dumps({"application": os.environ["APP_SLUG"], "version": os.environ["RELEASE_VERSION"], "commit": os.environ["GITHUB_SHA"]}, sort_keys=True))
          digest = "sha256:" + hashlib.sha256(artifact.read_bytes()).hexdigest()
          deployed = pathlib.Path("synthetic-deployed.json")
          deployed.write_bytes(artifact.read_bytes())
          assert "sha256:" + hashlib.sha256(deployed.read_bytes()).hexdigest() == digest
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"], "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest, "artifact_uri": "urn:helio-capacity:" + os.environ["APP_SLUG"] + "@" + digest, "rollback_workflow_id": ".github/workflows/" + os.environ["APP_SLUG"] + ".yml", "workflow_revision": os.environ["WORKFLOW_REVISION"]}
          pathlib.Path("deployment-evidence.json").write_text(json.dumps({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [], "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release", "payload": payload}))
          PY
          python3 - <<'PY'
          import json, os, subprocess, time
          repo, env, sha = os.environ["GITHUB_REPOSITORY"], os.environ["TARGET_ENVIRONMENT"], os.environ["GITHUB_SHA"]
          execution = os.environ["HELIO_EXECUTION_ID"]
          def gh(*args):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  raise RuntimeError((r.stderr or r.stdout).strip()[:300] or "gh exit " + str(r.returncode))
              return json.loads(r.stdout) if r.stdout.strip() else None
          def existing_deployment():
              for d in gh(f"repos/{repo}/deployments?environment={env}&sha={sha}&per_page=100") or []:
                  if (d.get("payload") or {}).get("helio_execution_id") == execution:
                      return d["id"]
          def has_success(deployment):
              return any(s.get("state") == "success" for s in gh(f"repos/{repo}/deployments/{deployment}/statuses?per_page=100") or [])
          def retried(label, step, attempts=6):
              for attempt in range(1, attempts + 1):
                  try:
                      value = step()
                      if value:
                          return value
                      print(f"{label}: attempt {attempt} returned nothing usable")
                  except Exception as error:
                      print(f"{label}: attempt {attempt} failed: {error}")
                  if attempt < attempts:
                      time.sleep(min(2 ** attempt, 30))
              raise SystemExit(f"{label}: no result after {attempts} attempts")
          def create():
              found = existing_deployment()
              if found:
                  return found
              created = gh("--method", "POST", f"repos/{repo}/deployments", "--input", "deployment-evidence.json")
              return (created or {}).get("id")
          deployment = retried("create deployment", create)
          def succeed():
              if not has_success(deployment):
                  gh("--method", "POST", f"repos/{repo}/deployments/{deployment}/statuses", "-f", "state=success",
                     "-f", "description=Synthetic capacity artifact copied and digest verified; no application deployment")
              return has_success(deployment)
          retried("record success", succeed)
          print(f"deployment {deployment} recorded with a success status")
          PY
